<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn JavaScript Basics</title>
</head>
<body>

<script>
    // Variables
    const name = "Javed";
    let age = 30;
    age = 31;
    console.log(name); // Javed
    console.log(age);  // 31

    // Arrow Function
    const add = (a, b) => {
        return a + b;
    }
    console.log("Addition: 5 + 5 = ", add(5,5));

    // Short Hand Method
    const sub = (a, b) => a - b;
    console.log(`Subtraction: 10 - 4 = ${sub(10, 4)}`);

    // Multiply Short Hand
    const multiply = (a, b) => a * b;
    console.log(`Multiply: 3 * 3 = ${multiply(3,3)}`);

    // Array
    const users = ["Javed", "Sara", "Ali"];
    console.log(users[0]);

    // Loop
    users.map( (user) => {
        console.log(user);
    });

    const numbers = [1,2,3,4];

    numbers.map( (num) => {
        console.log(num * 2);
    });

    // Filters

    const ages = [20, 15, 18, 17, 26];

    const filteredAges = ages.filter((age) => age >= 18);
    filteredAges.map( (age) => console.log(age) );

    //Objects
    const std_users = [
        {id: 1, name: "Javed", active:true},
        {id: 2, name: "Ahsan", active:true},
        {id: 3, name: "Kashif", active:false}
    ];

    //console.log(std_users);
    // Separate usage of filter and map functions
    // const activeUsers = std_users.filter( (user) => user.active);
    // console.log(activeUsers);
    // const userNames = activeUsers.map( (user) => user.name);
    // console.log(userNames);

    //Short Hand
    const userNames = std_users
    .filter( (user) => user.active)
    .map( (user) => user.name);
    console.log(userNames);

</script>    
</body>
</html>
